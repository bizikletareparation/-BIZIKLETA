<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | Bizikleta Grenoble</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: '#F5F2EB',
                        rougeBizikleta: '#D32F2F',
                    },
                    fontFamily: {
                        basque: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-beige text-stone-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-rougeBizikleta selection:text-white">

    <!-- En-tête / Header -->
    <header class="w-full border-b border-stone-300 py-4 px-6 bg-beige/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black font-basque text-rougeBizikleta tracking-wide uppercase">
                Bizikleta
            </a>
            <nav class="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm font-semibold">
                <a href="index.html" class="text-stone-700 hover:text-rougeBizikleta transition">Accueil</a>
                <span class="text-stone-300">•</span>
                <a href="tarifs.html" class="text-stone-700 hover:text-rougeBizikleta transition">Tarifs</a>
                <span class="text-stone-300">•</span>
                <a href="infos.html" class="text-stone-700 hover:text-rougeBizikleta transition">En savoir plus</a>
            </nav>
        </div>
    </header>

    <!-- Contenu Principal : Formulaire de Réservation -->
    <main class="flex-grow max-w-xl mx-auto px-4 py-12 space-y-6 w-full">
        <div class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-bold font-basque text-stone-900">Réservation</h1>
            <p class="text-xs text-stone-600 uppercase tracking-widest font-semibold">Prenez rendez-vous à Grenoble & alentours</p>
        </div>

        <!-- Formulaire avec script de validation -->
        <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200">
            <form id="reservationForm" class="space-y-4 text-sm" onsubmit="return validateForm(event)">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Prénom & Nom *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs"><i class="fa-solid fa-user"></i></span>
                            <input type="text" required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs" placeholder="Jean Dupont">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Téléphone *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" id="telephone" required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs" placeholder="0612345678">
                        </div>
                        <span id="telError" class="text-[10px] text-rougeBizikleta hidden">Format invalide (ex: 0612345678)</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="block text-xs font-bold text-stone-700 uppercase">Adresse email *</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-rougeBizikleta text-xs"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs" placeholder="jean.dupont@exemple.fr">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2 space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Adresse (Rue & Ville) *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs"><i class="fa-solid fa-location-dot"></i></span>
                            <input type="text" required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs" placeholder="3 Cours Berriat, Grenoble">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Code Postal *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs"><i class="fa-solid fa-map-pin"></i></span>
                            <input type="text" id="postalCode" required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs" placeholder="38000">
                        </div>
                        <span id="postalError" class="text-[10px] text-rougeBizikleta hidden">Invalide (5 chiffres)</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Type de vélo *</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs z-10"><i class="fa-solid fa-bicycle"></i></span>
                            <select required class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs appearance-none">
                                <option value="">Choisissez le type de vélo</option>
                                <option value="Ville / VTC">Ville / VTC</option>
                                <option value="VTT">VTT</option>
                                <option value="Route / Gravel">Route / Gravel</option>
                                <option value="Electrique / Cargo">Électrique / Cargo</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-stone-700 uppercase">Option Conciergerie ?</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-rougeBizikleta text-xs z-10"><i class="fa-solid fa-house-chimney"></i></span>
                            <select class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-3 py-2 text-stone-800 focus:outline-none focus:border-rougeBizikleta text-xs appearance-none">
                                <option value="Non">Non (Intervention classique)</option>
                                <option value="Oui (+10€)">Oui (+10 € : Récupération & retour atelier)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Type de prestation avec des pastilles cliquables -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-stone-700 uppercase">Type de prestation *</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        
                        <!-- Option 1 : Forfait révisions -->
                        <label class="flex items-center gap-2.5 p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:border-rougeBizikleta transition text-xs font-medium text-stone-800 [&:has(input:checked)]:border-rougeBizikleta [&:has(input:checked)]:bg-red-50/20 [&:has(input:checked)]:text-rougeBizikleta">
                            <input type="radio" name="prestation" value="Forfait revisions" required class="accent-rougeBizikleta">
                            <span class="w-6 h-6 rounded-full bg-stone-200 flex items-center justify-center text-stone-700 text-xs shrink-0">
                                <i class="fa-solid fa-screwdriver-wrench"></i>
                            </span>
                            <span>Forfait révisions</span>
                        </label>

                        <!-- Option 2 : Dépannage express -->
                        <label class="flex items-center gap-2.5 p-3 bg-stone-50 border border-stone-200 rounded-xl cursor-pointer hover:border-rougeBizikleta transition text-xs font-medium text-stone-800 [&:has(input:checked)]:border-rougeBizikleta [&:has(input:checked)]:bg-red-50/20 [&:has(input:checked)]:text-rougeBizikleta">
                            <input type="radio" name="prestation" value="Depannage express" required class="accent-rougeBizikleta">
                            <span class="w-6
