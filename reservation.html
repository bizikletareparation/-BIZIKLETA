<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | Bizikleta Grenoble</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: '#F5F2EB',
                        rougeBizikleta: '#D32F2F',
                    },
                    fontFamily: {
                        basque: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-beige text-stone-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-rougeBizikleta selection:text-white">

    <!-- En-tête / Header -->
    <header class="w-full border-b border-stone-300 py-4 px-6 bg-beige/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-2xl font-black font-basque text-rougeBizikleta tracking-wide uppercase">
                Bizikleta
            </a>
            <nav class="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm font-semibold">
                <a href="index.html" class="text-stone-700 hover:text-rougeBizikleta transition">Accueil</a>
                <span class="text-stone-300">•</span>
                <a href="tarifs.html" class="text-stone-700 hover:text-rougeBizikleta transition">Tarifs</a>
                <span class="text-stone-300">•</span>
                <a href="infos.html" class="text-stone-700 hover:text-rougeBizikleta transition">En savoir plus</a>
            </nav>
        </div>
    </header>

    <!-- Contenu Principal : Formulaire -->
    <main class="flex-grow max-w-xl mx-auto px-4 py-12 space-y-6 w-full">
        <div class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-bold font-basque text-stone-900">Réservation à Grenoble</h1>
            <p class="text-xs text-stone-600 uppercase tracking-widest font-semibold">Remplissez le formulaire pour planifier une intervention</p>
        </div>

        <div class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200">
            <form id="reservation-form" onsubmit="envoyerReservation(event)" class="space-y-4 text-left text-sm">
                <div>
                    <label class="block font-semibold text-stone-700 mb-1 text-xs">Type de vélo *</label>
                    <select name="velo" id="velo" class="w-full p-2.5 border rounded-xl bg-white text-xs focus:outline-none focus:border-rougeBizikleta" required>
                        <option value="">-- Sélectionnez votre vélo --</option>
                        <option value="Vélo de ville / VTC">Vélo de ville / VTC</option>
                        <option value="Vélo électrique (VAE)">Vélo électrique (VAE)</option>
                        <option value="VTT / Route">VTT / Route</option>
                        <option value="Vélo Cargo / Longtail">Vélo Cargo / Longtail</option>
                    </select>
                </div>

                <div>
                    <label class="block font-semibold text-stone-700 mb-1 text-xs">Prestation souhaitée *</label>
                    <select name="prestation" id="prestation" class="w-full p-2.5 border rounded-xl bg-white text-xs focus:outline-none focus:border-rougeBizikleta" required>
                        <option value="">-- Sélectionnez une prestation --</option>
                        <optgroup label="🛠️ Forfaits Révision">
                            <option value="Forfait Révision SECURITE (50 €)">Forfait Révision SÉCURITÉ (50 €)</option>
                            <option value="Forfait Révision INTEGRALE (90 €)">Forfait Révision INTÉGRALE (90 €)</option>
                            <option value="Forfait Révision PERFORMANCE (130 €)">Forfait Révision PERFORMANCE (130 €)</option>
                        </optgroup>
                        <optgroup label="⚡ Dépannage">
                            <option value="Crevaison Express - Roue classique (25 €)">Crevaison Express - Roue classique (25 €)</option>
                            <option value="Crevaison Express - Roue moteur (40 €)">Crevaison Express - Roue moteur (40 €)</option>
                        </optgroup>
                        <optgroup label="⚙️ Autre">
                            <option value="Réparation à la carte">Réparation à la carte</option>
                            <option value="Plusieurs vélos / Entreprise">Plusieurs vélos / Entreprise</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label class="block font-semibold text-stone-700 mb-1 text-xs">Description du problème</label>
                    <textarea name="description" id="description" rows="3" placeholder="Décrivez la panne ou le besoin..." class="w-full p-2.5 border rounded-xl text-xs focus:outline-none focus:border-rougeBizikleta"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" name="nom" id="nom" placeholder="Votre nom *" class="w-full p-2.5 border rounded-xl text-xs focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="tel" name="telephone" id="telephone" placeholder="Téléphone *" class="w-full p-2.5 border rounded-xl text-xs focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="text" name="code_postal" id="code_postal" placeholder="Code postal *" class="w-full p-2.5 border rounded-xl text-xs focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="text" name="adresse" id="adresse" placeholder="Adresse d'intervention *" class="w-full p-2.5 border rounded-xl text-xs focus:outline-none focus:border-rougeBizikleta" required>
                </div>

                <div>
                    <label for="photo" class="block font-medium mb-1 text-xs text-stone-600">Photo du problème (optionnel, max 4 Mo) :</label>
                    <input type="file" id="photo" accept="image/*" class="w-full p-2 border rounded-xl text-xs bg-stone-50">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-rougeBizikleta text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-md cursor-pointer">
                    Envoyer ma demande
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-stone-300 py-8 px-4 text-stone-700 text-xs sm:text-sm">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
            <div>
                <p class="font-bold text-stone-900">Grenoble & Alentours</p>
            </div>
            <div class="space-y-2 text-center">
                <p>
                    <a href="tel:0614753647" class="hover:text-rougeBizikleta transition font-semibold">06 14 75 36 47</a> 
                    <span class="mx-2">•</span> 
                    <a href="mailto:bizikleta.reparation@gmail.com" class="hover:text-rougeBizikleta transition">bizikleta.reparation@gmail.com</a>
                </p>
            </div>
            <div class="text-center md:text-right">
                <p class="font-bold text-stone-900">Lundi-Dimanche</p>
                <p class="text-stone-600">8h-19h</p>
            </div>
        </div>
    </footer>

    <!-- Script de gestion du formulaire -->
    <script>
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = (error) => reject(error);
            });
        }

        async function envoyerReservation(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerText = "Envoi en cours...";
            }

            const nom = document.getElementById('nom').value;
            const telephone = document.getElementById('telephone').value;
            const adresse = document.getElementById('adresse').value;
            const codePostal = document.getElementById('code_postal').value;
            const prestation = document.getElementById('prestation').value;
            const velo = document.getElementById('velo').value;
            const description = document.getElementById('description').value;

            const photoInput = document.getElementById('photo');
            let photoData = null;

            if (photoInput && photoInput.files.length > 0) {
                const file = photoInput.files[0];
                if (file.size > 4 * 1024 * 1024) {
                    alert("La photo est trop lourde (maximum 4 Mo).");
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Envoyer ma demande";
                    }
                    return;
                }
                try {
                    const base64Content = await fileToBase64(file);
                    photoData = { filename: file.name, content: base64Content };
                } catch (err) {
                    console.error(err);
                }
            }

            try {
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nom,
                        telephone,
                        adresse: `${adresse} (${codePostal})`,
                        prestation,
                        velo,
                        description,
                        photo: photoData
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert("Demande envoyée avec succès ! Je vous recontacte rapidement.");
                    document.getElementById('reservation-form').reset();
                } else {
                    alert("Erreur lors de l'envoi. Appelez directement au 06 14 75 36 47.");
                }
            } catch (err) {
                console.error(err);
                alert("Impossible de joindre le serveur. Appelez directement au 06 14 75 36 47.");
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Envoyer ma demande";
                }
            }
        }
    </script>
</body>
</html>
