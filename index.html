                    <label class="block font-semibold text-stone-700 mb-1">Type de vélo</label>
                    <select name="velo" id="velo" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:border-rougeBizikleta" required>
                        <option value="">-- Sélectionnez votre vélo --</option>
                        <option value="Vélo de ville / VTC">Vélo de ville / VTC</option>
                        <option value="Vélo électrique (VAE)">Vélo électrique (VAE)</option>
                        <option value="VTT / Route">VTT / Route</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-stone-700 mb-1">Choix du forfait ou prestation</label>
                    <select name="prestation" id="prestation" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:border-rougeBizikleta" required>
                        <option value="">-- Sélectionnez une prestation --</option>
                        <option value="Révision Sécurité (49 €)">Révision Sécurité (49 €)</option>
                        <option value="Révision Intégrale (89 €)">Révision Intégrale (89 €)</option>
                        <option value="A La Carte">A La Carte</option>
                        <option value="Crevaison Express">Crevaison Express</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-stone-700 mb-1">Description du problème</label>
                    <textarea name="description" id="description" rows="2" placeholder="Décrivez votre panne..." class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" name="nom" id="nom" placeholder="Votre nom" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="tel" name="telephone" id="telephone" placeholder="Votre téléphone" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="text" name="Code postal" id="Code postal" placeholder="Code postal" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="text" name="adresse" id="adresse" placeholder="Votre adresse" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                </div>
                <!-- Champ pour la photo -->
                <div class="mb-4">
                  <label for="photo" class="block font-medium mb-1 text-xs text-stone-600">Photo du problème (optionnel, max 4 Mo) :</label>
                  <input 
                    type="file" 
                    id="photo" 
                    accept="image/*" 
                    class="w-full p-2 border rounded-xl text-xs bg-stone-50"
                  >
                </div>
                <button type="submit" class="w-full bg-rougeBizikleta text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-md">
                    Envoyer ma demande
                </button>
            </form>
        `;

        function openModal(type) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('modal-content');
            if (type === 'tarifs') {
                container.innerHTML = contentTarifs;
            } else if (type === 'infos') {
                container.innerHTML = contentInfos;
            } else {
                container.innerHTML = contentReservation;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = (error) => reject(error);
            });
        }

        async function envoyerReservation(event) {
            event.preventDefault();

            const nom = document.getElementById('nom').value;
            const telephone = document.getElementById('telephone').value;
            const adresse = document.getElementById('adresse').value;
            const prestation = document.getElementById('prestation').value;
            const velo = document.getElementById('velo').value;
            const description = document.getElementById('description').value;

            const photoInput = document.getElementById('photo');
            let photoData = null;

            if (photoInput && photoInput.files.length > 0) {
                const file = photoInput.files[0];
                
                if (file.size > 4 * 1024 * 1024) {
                    alert("La photo est trop lourde (maximum 4 Mo). Veuillez en choisir une plus légère.");
                    return;
                }

                try {
                    const base64Content = await fileToBase64(file);
                    photoData = {
                        filename: file.name,
                        content: base64Content
                    };
                } catch (err) {
                    console.error("Erreur lors de la lecture du fichier :", err);
                }
            }

            try {
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nom,
                        telephone,
                        adresse,
                        prestation,
                        velo,
                        description,
                        photo: photoData
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    const container = document.getElementById('modal-content');
                    container.innerHTML = `
                        <div class="text-center py-8 space-y-4">
                            <div class="text-5xl text-green-600"><i class="fa-solid fa-circle-check"></i></div>
                            <h2 class="text-2xl font-bold font-basque text-stone-900">Demande de rendez-vous envoyée !</h2>
                            <p class="text-stone-600 text-sm">Merci ! Votre message a bien été transmis à l'atelier. Nous vous recontacterons très rapidement.</p>
                            <button onclick="closeModal()" class="bg-stone-900 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-rougeBizikleta transition">
                                Fermer
                            </button>
                        </div>
                    `;
                } else {
                    alert("Une erreur est survenue : " + (result.error || "Erreur inconnue"));
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                alert("Erreur de connexion. Vérifiez votre réseau.");
            }
        }
                // Détecter si un paramètre d'URL demande d'ouvrir une modale au chargement
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const modalParam = urlParams.get('modal');
            if (modalParam) {
                openModal(modalParam);
            }
        });
    </script>
</body>
</html>
