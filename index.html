            <h2 class="text-2xl font-bold font-basque text-stone-900 mb-4">Réservation à Grenoble</h2>

                    <label class="block font-semibold text-stone-700 mb-1">Type de vélo</label>
                    <select name="velo" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:border-rougeBizikleta" required>
                        <option value="">-- Sélectionnez votre vélo --</option>
                        <option value="Vélo de ville / VTC">Vélo de ville / VTC</option>
                        <option value="Vélo électrique (VAE)">Vélo électrique (VAE)</option>
                        <option value="VTT / Route">VTT / Route</option>
                        <option value="Vélo cargo / Autre">Vélo cargo / Autre</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-stone-700 mb-1">Description du problème</label>
                    <textarea name="description" rows="2" placeholder="Décrivez votre panne..." class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" name="nom" placeholder="Votre nom" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                    <input type="tel" name="telephone" placeholder="Votre téléphone" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                </div>
                <input type="text" name="adresse" placeholder="Votre adresse à Grenoble" class="w-full p-3 border rounded-xl focus:outline-none focus:border-rougeBizikleta" required>
                <button type="submit" class="w-full bg-rougeBizikleta text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-md">
                    Envoyer ma demande
                </button>
            </form>
        `;

        function openModal(type) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('modal-content');
            container.innerHTML = (type === 'tarifs') ? contentTarifs : contentReservation;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function envoyerReservation(event) {
            event.preventDefault();
            const form = event.target;
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const container = document.getElementById('modal-content');
                    container.innerHTML = `
                        <div class="text-center py-8 space-y-4">
                            <div class="text-5xl text-green-600"><i class="fa-solid fa-circle-check"></i></div>
                            <h2 class="text-2xl font-bold font-basque text-stone-900">Demande de rendez-vous envoyée !</h2>
                            <p class="text-stone-600 text-sm">Merci ! Votre message a bien été transmis à l'atelier. Nous vous recontacterons très rapidement.</p>
                            <button onclick="closeModal()" class="bg-stone-900 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-rougeBizikleta transition">
                                Fermer
                            </button>
                        </div>
                    `;
                } else {
                    alert("Une erreur est survenue : " + (result.error || "Erreur inconnue"));
                }
            } catch (error) {
                alert("Erreur de connexion. Vérifiez votre réseau.");
            }
        }
    </script>
